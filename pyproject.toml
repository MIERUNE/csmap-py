[project]
name = "csmap-py"
version = "0.2.0"
description = ""
authors = [{ name = "MIERUNE Inc.", email = "info@mierune.co.jp" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.2",
    "rasterio>=1.3.9",
]

[project.scripts]
csmap = "csmap.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "csmap"
module-root = ""
